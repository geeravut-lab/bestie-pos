name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint + repo conventions (no raw colours, no Thai literals in code, no public secrets)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database migrations + RLS tests (throw-away Postgres)
        run: bash supabase/tests/run-local.sh

      - name: Build all apps
        run: pnpm build

      - name: The service-role key must never reach a browser bundle
        run: "! grep -rilE 'service_role' apps/*/dist"

      - name: 'Install Playwright browser (the Ubuntu mirrors time out now and then, so retry)'
        run: |
          for i in 1 2 3 4; do
            sudo apt-get update -o Acquire::Retries=3 || true
            pnpm --filter @bestie/pos exec playwright install --with-deps chromium && exit 0
            echo "attempt $i failed, waiting"; sleep $((i * 20))
          done
          exit 1

      - name: E2E + accessibility (390x844 phone, 1280x800 desktop; Thai + English)
        run: pnpm --filter @bestie/pos e2e
