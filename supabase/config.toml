# Supabase CLI config for LOCAL development (`supabase start`). Production lives in the hosted
# project https://pqomylchauwecpgqxoad.supabase.co — never put its keys in this file.
# Docs: https://supabase.com/docs/guides/local-development
project_id = "bestie-pos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "http://localhost:5174/**",
  "http://localhost:5175/**",
  "https://bestie-pos.vercel.app/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
